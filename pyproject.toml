[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tsukumo"
version = "0.1.0"
description = "Capture a master craftsperson's tacit skill from their tool, and train apprentices against it."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "pydantic>=2.7",
    "anthropic>=1.0",
    "qrcode>=7.4",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["tsukumo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
